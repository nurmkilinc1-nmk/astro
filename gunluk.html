<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Günlük — luna.gram</title>
  <script>if(localStorage.getItem('astro-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Gündüz & Gece Camsı Gökyüzü Arka Planı */
    body.glass-daily {
      background: linear-gradient(180deg, #dce8f4 0%, #eef2f6 38%, #f6f3ed 100%) !important;
      background-attachment: fixed;
    }
    html[data-theme="dark"] body.glass-daily {
      background: linear-gradient(180deg, #070d1b 0%, #0e172e 42%, #121c36 100%) !important;
      color: #f6f2e9;
    }
    .daily-shell {
      max-width: 820px;
      margin: 18px auto 104px;
      padding: 0 16px;
    }
    /* Üst Satır: Tarih Seçici + Sağ Köşede Aylık Takvim Kısayolu */
    .top-utility-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .day-switcher {
      flex: 1;
      min-width: 230px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 6px 8px;
    }
    html[data-theme="dark"] .day-switcher {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .day-nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid rgba(184, 124, 94, 0.22);
      background: rgba(255, 255, 255, 0.45);
      color: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    html[data-theme="dark"] .day-nav-btn {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
    }
    .day-center { text-align: center; min-width: 0; }
    .day-center-title { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; }
    .day-center-sub {
      font-size: 0.78rem;
      opacity: 0.72;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .today-jump {
      border: none;
      background: rgba(184, 124, 94, 0.2);
      color: var(--highlight, #b87c5e);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
    }
    .monthly-link-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 48px;
      padding: 0 15px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: inherit;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      white-space: nowrap;
    }
    html[data-theme="dark"] .monthly-link-pill {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
      color: #f6f2e9;
    }
    .monthly-link-pill svg { width: 17px !important; height: 17px !important; }
    /* Sade Camsı Gün Özeti + Minimal Renk Satırı */
    .daily-glass-hero {
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 32px rgba(15, 28, 56, 0.07);
    }
    html[data-theme="dark"] .daily-glass-hero {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 14px 36px rgba(3, 6, 16, 0.35);
    }
    .daily-glass-hero h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.65rem;
      font-weight: 500;
      margin: 0 0 6px;
    }
    .daily-glass-hero p {
      margin: 0 0 14px;
      font-size: 0.94rem;
      line-height: 1.55;
      opacity: 0.8;
    }
    /* Minimal Günün Rengi Şeridi */
    .color-strip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px 7px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(184, 124, 94, 0.22);
      font-size: 0.83rem;
    }
    html[data-theme="dark"] .color-strip {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
    }
    .color-info-mini {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(184, 124, 94, 0.3);
      background: transparent;
      color: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }
    /* Bölüm Başlıkları */
    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.72;
      margin: 20px 2px 10px;
    }
    /* Önerilen (Hafif Yeşil) ve Uyarı (Hafif Kırmızı) Camsı Kartlar */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 620px) {
      .topic-grid { grid-template-columns: 1fr; }
    }
    .topic-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 17px;
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .topic-card:active { transform: scale(0.98); }

    /* Çok hafif yeşil ışıltı (Önerilen) */
    .topic-card.is-good {
      background: rgba(52, 199, 128, 0.12);
      border: 1px solid rgba(52, 199, 128, 0.34);
      box-shadow: 0 8px 24px rgba(34, 150, 94, 0.08), inset 0 1px 0 rgba(160, 245, 200, 0.28);
    }
    html[data-theme="dark"] .topic-card.is-good {
      background: rgba(52, 199, 128, 0.11);
      border-color: rgba(74, 222, 148, 0.28);
      box-shadow: 0 10px 28px rgba(10, 42, 28, 0.35), inset 0 1px 0 rgba(134, 239, 172, 0.16);
    }

    /* Çok hafif kırmızı ışıltı (Sakınılmalı / Uyarı) */
    .topic-card.is-warn {
      background: rgba(235, 87, 87, 0.11);
      border: 1px solid rgba(235, 87, 87, 0.32);
      box-shadow: 0 8px 24px rgba(190, 55, 55, 0.08), inset 0 1px 0 rgba(255, 195, 195, 0.25);
    }
    html[data-theme="dark"] .topic-card.is-warn {
      background: rgba(235, 87, 87, 0.11);
      border-color: rgba(248, 113, 113, 0.28);
      box-shadow: 0 10px 28px rgba(48, 14, 18, 0.35), inset 0 1px 0 rgba(252, 165, 165, 0.16);
    }

    .topic-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .topic-title {
      font-family: 'Fraunces', serif;
      font-size: 1.08rem;
      font-weight: 600;
      margin: 0;
    }
    .topic-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .is-good .topic-pill {
      background: rgba(34, 168, 102, 0.16);
      color: #16794a;
    }
    html[data-theme="dark"] .is-good .topic-pill {
      background: rgba(74, 222, 148, 0.18);
      color: #86efac;
    }
    .is-warn .topic-pill {
      background: rgba(220, 68, 68, 0.16);
      color: #a62b2b;
    }
    html[data-theme="dark"] .is-warn .topic-pill {
      background: rgba(248, 113, 113, 0.18);
      color: #fca5a5;
    }
    .topic-desc {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.5;
      opacity: 0.82;
    }
    .topic-foot {
      margin-top: auto;
      padding-top: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.68;
      display: flex;
      justify-content: flex-end;
    }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      z-index: 1250;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
    .modal-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg, #fbf9f4);
      color: var(--text, #1c1b1a);
      border: 1px solid rgba(184, 124, 94, 0.28);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .modal-head h3 { font-family: 'Fraunces', serif; margin: 0; font-size: 1.15rem; }
    .modal-close-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(184, 124, 94, 0.3);
      background: transparent;
      color: inherit;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .theme-toggle svg { width: 20px !important; height: 20px !important; }
  </style>
</head>

    <section class="daily-glass-hero">

  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>
  <script src="js/app.js" defer></script>
  <script>
    (function () {
      const SIGNS = [
        { name: 'Koç', el: 'Ateş', summary: 'Hızlı, cesur ve hareketli bir gün. Ertelenen işlere ilk adımı atmak için enerji yüksek.' },
        { name: 'Boğa', el: 'Toprak', summary: 'Sakin, somut ve keyifli bir akış var. Kendine bakım yapmak ve düzen kurmak iyi gelir.' },
        { name: 'İkizler', el: 'Hava', summary: 'İletişim, sohbet ve yeni fikirler akıcı. Görüşmeler ve planlamalar kolay ilerler.' },
        { name: 'Yengeç', el: 'Su', summary: 'Duygusal, sezgisel ve içe dönük bir gün. Ev, aile ve dinlenme ön planda.' },
        { name: 'Aslan', el: 'Ateş', summary: 'Sıcak, yaratıcı ve özgüvenli bir enerji. Kendini ifade etmek ve parlamak için güzel bir gün.' },
        { name: 'Başak', el: 'Toprak', summary: 'Düzen, arınma ve detayları toparlama günü. Sağlık ve günlük rutinler verimli olur.' },
        { name: 'Terazi', el: 'Hava', summary: 'Uyum, estetik ve sosyal denge öne çıkıyor. İlişkiler ve güzellik bakımları desteklenir.' },
        { name: 'Akrep', el: 'Su', summary: 'Derin odaklanma ve arınma zamanı. Gereksiz yüklerden kurtulmak rahatlatır.' },
        { name: 'Yay', el: 'Ateş', summary: 'İyimser, özgür ve keşfe açık bir gün. Seyahat, eğitim ve yeni planlar keyifli akar.' },
        { name: 'Oğlak', el: 'Toprak', summary: 'Ciddi, kararlı ve üretken bir enerji. İş, imza ve uzun vadeli adımlar sağlam oturur.' },
        { name: 'Kova', el: 'Hava', summary: 'Yenilikçi ve sosyal bir gün. Arkadaş buluşmaları ve farklı fikirler ön planda.' },
        { name: 'Balık', el: 'Su', summary: 'Sezgisel, yumuşak ve dinlendirici bir akış. Sanat, şifa ve sakinlik iyi gelir.' }
      ];

      const DAY_COLORS = [
        { planet: 'Güneş', name: 'Altın Sarısı', hex: '#D4A03E', desc: 'Pazar günü Güneş yönetimindedir. Altın ve sıcak sarı tonları canlılık ve özgüven verir.' },
        { planet: 'Ay', name: 'İnci Beyazı', hex: '#C8CED6', desc: 'Pazartesi Ay yönetimindedir. İnci, krem ve gümüş tonları sakinlik ve duygusal denge sunar.' },
        { planet: 'Mars', name: 'Mercan & Terrakota', hex: '#C05A43', desc: 'Salı Mars yönetimindedir. Sıcak kırmızı ve mercan tonları cesaret ve hareket enerjisi katar.' },
        { planet: 'Merkür', name: 'Adaçayı Yeşili', hex: '#6F9279', desc: 'Çarşamba Merkür yönetimindedir. Yeşil tonları zihinsel berraklık ve akıcı iletişimi destekler.' },
        { planet: 'Jüpiter', name: 'İndigo & Mor', hex: '#63538A', desc: 'Perşembe Jüpiter yönetimindedir. Mor ve derin çivit tonları bereket ve geniş vizyon taşır.' },
        { planet: 'Venüs', name: 'Gül Kurusu', hex: '#C6858E', desc: 'Cuma Venüs yönetimindedir. Gül kurusu ve pastel tonlar uyum, zarafet ve sevgi enerjisini besler.' },
        { planet: 'Satürn', name: 'Gece Laciverti', hex: '#344059', desc: 'Cumartesi Satürn yönetimindedir. Lacivert ve koyu tonlar odaklanma ve sağlamlık hissi verir.' }
      ];

      const MONTHS_TR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
      const DAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

      let dayOffset = 0;
      const now = new Date();
      const baseDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
      const colorModal = document.getElementById('colorModal');

      function buildTopics(signIdx, waxing) {
        const s = SIGNS[signIdx];
        const el = s.el;

        // Repodaki gerçek konu sayfalarına bağlı, sade ve tekrarsız 8 ana kategori
        return [
          {
            title: 'Saç & Güzellik Bakımı',
            href: 'sac-bakim.html',
            good: ['Boğa', 'Aslan', 'Başak', 'Terazi'].includes(s.name) || waxing,
            goodText: 'Saç kesimi, cilt yenileme ve kişisel bakım uygulamaları bugün çok güzel sonuç verir.',
            warnText: 'Köklü imaj değişiklikleri veya agresif cilt işlemleri için birkaç gün beklemek daha iyi.'
          },
          {
            title: 'Yeni Başlangıçlar',
            href: 'yeni-baslangiclar.html',
            good: waxing && ['Ateş', 'Hava', 'Toprak'].includes(el),
            goodText: 'Yeni bir projeye, alışkanlığa veya hedefe ilk adımı atmak için gökyüzü destekleyici.',
            warnText: 'Sıfırdan büyük başlangıçlar yerine yarım kalan işleri toparlamak bugün daha verimli.'
          },
          {
            title: 'İmza, İş & Sözleşme',
            href: 'imza-sozlesme.html',
            good: ['Boğa', 'İkizler', 'Başak', 'Terazi', 'Oğlak'].includes(s.name),
            goodText: 'Resmi anlaşmalar, finansal kararlar ve kariyer görüşmeleri için sağlam bir zemin var.',
            warnText: 'Büyük sözleşmelerde detayları iki kez oku; aceleyle imza atmaktan kaçın.'
          },
          {
            title: 'İlişkiler & Sosyal Hayat',
            href: 'sosyal.html',
            good: ['İkizler', 'Aslan', 'Terazi', 'Yay', 'Kova'].includes(s.name),
            goodText: 'Buluşmalar, keyifli sohbetler ve ilişkilerde yakınlaşmak için akıcı bir gün.',
            warnText: 'Alınganlık veya sabırsızlık artabilir; hassas konuşmaları sakin bir ana bırak.'
          },
          {
            title: 'Detoks & Arınma',
            href: 'detoks.html',
            good: !waxing || ['Başak', 'Akrep', 'Balık'].includes(s.name),
            goodText: 'Hafif beslenme, bol su, ev düzenleme ve dijital arınma bugün çok rahat işler.',
            warnText: 'Bedeni zorlayan sert diyetler yerine dengeli ve besleyici rutinleri tercih et.'
          },
          {
            title: 'Sağlık & Beden',
            href: 'saglik-tedavi.html',
            good: ['Boğa', 'Başak', 'Oğlak', 'Terazi'].includes(s.name),
            goodText: 'Rutin kontroller, esneme, masaj ve bedeni güçlendiren uygulamalar için uygun.',
            warnText: 'Aşırı yorgunluktan kaçın; bedenin dinlenme sinyallerini bugün görmezden gelme.'
          },
          {
            title: 'Seyahat & Hareket',
            href: 'seyahat.html',
            good: ['Koç', 'İkizler', 'Yay', 'Kova'].includes(s.name),
            goodText: 'Kısa yolculuklar, rota planlama ve açık hava aktiviteleri keyifli ve akıcı geçer.',
            warnText: 'Yol planlarında küçük gecikmelere karşı zaman payı bırakmak rahat ettirir.'
          },
          {
            title: 'Mutfak & Ev / Bitki',
            href: ['Yengeç', 'Boğa', 'Başak'].includes(s.name) ? 'gida-mutfak.html' : 'bahcivanlik.html',
            good: ['Boğa', 'Yengeç', 'Başak', 'Balık'].includes(s.name),
            goodText: 'Evde yeni tarifler denemek, bitki bakımı ve yaşam alanını güzelleştirmek için harika.',
            warnText: 'Büyük ev tadilatları veya ağır mutfak hazırlıkları yerine pratik çözümlere yönel.'
          }
        ];
      }

      function renderDay() {
        const target = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + dayOffset, 12, 0, 0);
        document.getElementById('dateTitle').textContent = `${target.getDate()} ${MONTHS_TR[target.getMonth()]} ${target.getFullYear()}`;
        document.getElementById('dateSub').textContent = `${DAYS_TR[target.getDay()]}${dayOffset === 0 ? ' · Bugün' : ''}`;
        document.getElementById('todayBtn').style.display = dayOffset === 0 ? 'none' : 'inline-block';

        const cInfo = DAY_COLORS[target.getDay()];
        document.getElementById('colorSwatch').style.background = cInfo.hex;
        document.getElementById('colorTitle').textContent = `Günün Rengi: ${cInfo.name}`;
        document.getElementById('colorModalTitle').textContent = `${cInfo.name} (${cInfo.planet} Günü)`;
        document.getElementById('colorModalBody').textContent = cInfo.desc;

        let signIdx = 0;
        let waxing = true;

        if (typeof Astronomy !== 'undefined') {
          try {
            const norm = (deg) => ((deg % 360) + 360) % 360;
            const moonLon = norm(Astronomy.EclipticGeoMoon(target).lon);
            const sunLon = norm(Astronomy.Ecliptic(Astronomy.GeoVector(Astronomy.Body.Sun, target, true)).elon);
            signIdx = Math.floor(moonLon / 30) % 12;
            waxing = norm(moonLon - sunLon) < 180;
          } catch (err) {
            console.error('Gunluk hesaplama hatasi:', err);
          }
        }

        const sign = SIGNS[signIdx];
        document.getElementById('moonHeadline').textContent = `Ay ${sign.name} Burcunda`;
        document.getElementById('moonSummary').textContent = sign.summary;

        const topics = buildTopics(signIdx, waxing);
        const goodItems = topics.filter((t) => t.good);
        const warnItems = topics.filter((t) => !t.good);

        const renderCard = (t) => `
          <a href="${t.href}" class="topic-card ${t.good ? 'is-good' : 'is-warn'}">
            <div class="topic-top">
              <h2 class="topic-title">${t.title}</h2>
              <span class="topic-pill">${t.good ? 'Önerilir' : 'Dikkat'}</span>
            </div>
            <p class="topic-desc">${t.good ? t.goodText : t.warnText}</p>
            <div class="topic-foot">Detayı Oku ›</div>
          </a>
        `;

        document.getElementById('goodGrid').innerHTML = goodItems.map(renderCard).join('');
        document.getElementById('warnGrid').innerHTML = warnItems.map(renderCard).join('');
      }

      document.getElementById('prevDayBtn').addEventListener('click', () => { dayOffset--; renderDay(); });
      document.getElementById('nextDayBtn').addEventListener('click', () => { dayOffset++; renderDay(); });
      document.getElementById('todayBtn').addEventListener('click', () => { dayOffset = 0; renderDay(); });

      document.getElementById('colorInfoBtn').addEventListener('click', () => colorModal.classList.add('open'));
      document.getElementById('closeColorModal').addEventListener('click', () => colorModal.classList.remove('open'));
      colorModal.addEventListener('click', (e) => { if (e.target === colorModal) colorModal.classList.remove('open'); });

      renderDay();
    })();
  </script>
</body>
</html>
