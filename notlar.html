<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notlarım — luna.gram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body class="weather-sky-home notes-page">

<header id="mainHeader">
  <div class="header-inner">
    <a href="index.html" class="logo">luna<span>.</span>gram</a>

    <div class="nav-wrapper">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menüyü aç/kapat">
        <span></span><span></span><span></span>
      </button>

      <nav id="mainNav">
        <a href="gunluk.html">Günlük</a>
        <a href="aylik-takvim.html">Aylık Takvim</a>
        <a href="ozel-takvimler.html">Özel Takvimler</a>
        <a href="notlar.html">Notlarım</a>
        <a href="hakkimda.html">Hakkımda</a>
      </nav>

      <a href="kayit.html" class="btn-ghost highlight">Kaydol</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
        <span class="theme-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>

<main class="notes" id="notesPage">
  <section class="notes-top">
    <h1 class="notes-title">Notlarım</h1>
    <p class="notes-sub" id="notesSub">Ay günlüğün</p>
  </section>

  <section class="wx-card glass today-prompt" aria-label="Bugünün Ay'ı">
    <div class="tp-row">
      <span class="tp-moon" id="tpMoon" aria-hidden="true"></span>
      <div class="tp-text">
        <span class="tp-meta" id="tpMeta">&nbsp;</span>
        <strong class="tp-q" id="tpPrompt">&nbsp;</strong>
      </div>
    </div>
    <button type="button" class="tp-btn" id="newNoteBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Yeni not
    </button>
  </section>

  <section class="insights" id="insights" hidden></section>

  <div class="notes-tools">
    <div class="notes-filters" id="noteFilters" role="radiogroup" aria-label="Filtre"></div>
    <label class="notes-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input type="search" id="noteSearch" placeholder="Notlarda ara" autocomplete="off" aria-label="Notlarda ara">
    </label>
  </div>

  <section class="notes-list" id="notesList" aria-live="polite"></section>
</main>

<div class="sheet-backdrop" id="noteSheet" hidden>
  <div class="sheet glass note-sheet" role="dialog" aria-modal="true" aria-labelledby="noteSheetTitle">
    <span class="sheet-grip" aria-hidden="true"></span>
    <form id="noteForm" novalidate>
      <div class="ns-head">
        <span class="ns-moon" id="nsMoon" aria-hidden="true"></span>
        <div>
          <h3 class="sheet-title" id="noteSheetTitle">Yeni not</h3>
          <p class="sheet-when" id="nsMeta">&nbsp;</p>
        </div>
      </div>
      <textarea id="noteText" class="ask-text note-text" rows="6" maxlength="2000" placeholder="Bugün neler hissediyorsun?"></textarea>
      <p class="ds-label">Ruh hâlin</p>
      <div class="moods" id="moodPicker" role="radiogroup" aria-label="Ruh hâli"></div>
      <label class="intent-toggle">
        <input type="checkbox" id="noteIntent">
        <span class="it-switch" aria-hidden="true"></span>
        <span><b>Niyet olarak işaretle</b><small>Yeniay niyetlerini ve hedeflerini ayrıca görürsün.</small></span>
      </label>
      <div class="sheet-actions">
        <button type="submit" class="sheet-btn sheet-btn--primary" id="noteSave">Kaydet</button>
        <button type="button" class="sheet-btn note-del" id="noteDelete" hidden>Notu sil</button>
        <button type="button" class="sheet-btn sheet-btn--ghost" id="noteCancel">Vazgeç</button>
      </div>
    </form>
  </div>
</div>

<footer>
  <div>© 2026 luna.gram</div>
  <div class="mono">İstanbul</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>
<script src="js/astro-core.js"></script>
<script src="js/device.js" defer></script>
<script src="js/notlar.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
