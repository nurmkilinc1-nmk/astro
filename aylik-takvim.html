<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aylık Takvim — luna.gram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body class="weather-sky-home cal-page">

<header id="mainHeader">
  <div class="header-inner">
    <a href="index.html" class="logo">luna<span>.</span>gram</a>

    <div class="nav-wrapper">
      <button class="hamburger" id="hamburgerBtn" aria-label="Menüyü aç/kapat">
        <span></span><span></span><span></span>
      </button>

      <nav id="mainNav">
        <a href="gunluk.html">Günlük</a>
        <a href="aylik-takvim.html" class="active">Aylık Takvim</a>
        <a href="ozel-takvimler.html">Özel Takvimler</a>
        <a href="astrosozluk.html">Astro Sözlük</a>
        <a href="hakkimda.html">Hakkımda</a>
      </nav>

      <a href="kayit.html" class="btn-ghost highlight">Kaydol</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
        <span class="theme-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>

<main class="cal" id="calPage">

  <div class="cal-top">
    <button type="button" class="icon-btn cal-nav" id="prevMonth" aria-label="Önceki ay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <h1 class="cal-title" id="monthTitle" aria-live="polite">&nbsp;</h1>
    <button type="button" class="icon-btn cal-nav" id="nextMonth" aria-label="Sonraki ay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>

  <div class="act-chips" id="actChips" role="radiogroup" aria-label="Ne yapmak istiyorsun?"></div>
  <p class="act-summary" id="actSummary">&nbsp;</p>

  <section class="cal-card glass" aria-label="Takvim">
    <div class="cal-weekdays" aria-hidden="true"><span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend" id="calLegend">
      <span class="lg lg-good">Uygun</span>
      <span class="lg lg-bad">Kaçın</span>
      <span class="lg lg-voc">Ay boşluğu</span>
    </div>
  </section>

  <section class="voc-month glass" aria-labelledby="vocMonthTitle">
    <div class="voc-month-head">
      <h2 id="vocMonthTitle">Ay boşlukları</h2>
      <span class="voc-month-meta" id="vocMonthMeta"></span>
    </div>
    <ul class="voc-month-list" id="vocMonthList"></ul>
    <button type="button" class="voc-month-more" id="vocMonthMore" hidden>Tümünü göster</button>
  </section>
</main>

<div class="sheet-backdrop" id="daySheet" hidden>
  <div class="sheet glass day-sheet" role="dialog" aria-modal="true" aria-labelledby="daySheetTitle">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="day-sheet-body" id="daySheetBody"></div>
  </div>
</div>

<footer>
  <div>© 2026 luna.gram</div>
  <div class="mono">İstanbul</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine/astronomy.browser.min.js"></script>
<script src="js/astro-core.js"></script>
<script src="js/activities.js"></script>
<script src="js/device.js" defer></script>
<script src="js/takvim.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
